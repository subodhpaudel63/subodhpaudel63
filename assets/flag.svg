<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 64"
     width="1200"
     height="64"
     role="img"
     aria-label="Strand of Himalayan prayer flags swaying in the wind">

  <style>
    .fl {
      transform-box: fill-box;
      transform-origin: 50% 0;
      animation: sway 3.4s ease-in-out infinite;
    }

    @keyframes sway {
      0%,100% {
        transform: skewX(-8deg);
      }

      50% {
        transform: skewX(8deg) scaleY(.95);
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .fl {
        animation: none;
      }
    }
  </style>

  <!-- Rope -->
  <path d="M0,10 Q600,38 1200,10"
        fill="none"
        stroke="#94A3B8"
        stroke-width="1.6"
        stroke-linecap="round"
        opacity=".85"/>

  <!-- Flags -->
